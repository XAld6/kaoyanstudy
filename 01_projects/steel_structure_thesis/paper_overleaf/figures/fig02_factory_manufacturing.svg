<tspan x="1190" dy="26">无损检测</tspan>
</text>
<line x1="1300" y1="415" x2="1320" y2="415" stroke="#1F4E73" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect x="1330" y="360" width="200" height="110" rx="14" fill="#DDECF7" stroke="#2F6FA3" stroke-width="3"/>
<text x="1430" y="394" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#2F6FA3" text-anchor="middle" dominant-baseline="middle" font-weight="700">
涂装发运
</text>
<text x="1430" y="437" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
<tspan x="1430" dy="-13.0">除锈喷涂</tspan>
<tspan x="1430" dy="26">成品保护</tspan>
</text>
<polygon points="800,585 920,650 800,715 680,650" fill="#F7E5CC" stroke="#D8892C" stroke-width="3"/>
<text x="800" y="650" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#D8892C" text-anchor="middle" dominant-baseline="middle" font-weight="700">
<tspan x="800" dy="-16.0">质量检验</tspan>
<tspan x="800" dy="32">不合格返修</tspan>
</text>
<polyline points="800,530 800,585" fill="none" stroke="#D8892C" stroke-width="4" marker-end="url(#arrow-orange)"/>
<polyline points="680,650 500,650 500,480" fill="none" stroke="#D8892C" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="500" y="700" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#D8892C" text-anchor="middle" dominant-baseline="middle">
返修闭环
</text>
<rect x="160" y="720" width="1280" height="120" rx="14" fill="#EEF1F4" stroke="#6C757D" stroke-width="3"/>
<text x="800" y="754" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#222222" text-anchor="middle" dominant-baseline="middle" font-weight="700">
工厂化制造的核心意义
</text>
<text x="800" y="802" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
<tspan x="800" dy="-13.0">将大量高精度、高风险作业前移至可控工厂环境，减少现场湿作业和返工，提高构件一致性</tspan>
<tspan x="800" dy="26">。</tspan>
</text>
</svg>