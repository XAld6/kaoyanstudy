<tspan x="470" dy="26">外观尺寸</tspan>
</text>
<line x1="580" y1="415" x2="600" y2="415" stroke="#1F4E73" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect x="610" y="360" width="200" height="110" rx="14" fill="#DDECF7" stroke="#2F6FA3" stroke-width="3"/>
<text x="710" y="394" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#2F6FA3" text-anchor="middle" dominant-baseline="middle" font-weight="700">
数控下料
</text>
<text x="710" y="437" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
