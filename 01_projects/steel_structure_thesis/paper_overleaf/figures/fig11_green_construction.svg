<tspan x="230" dy="26">利于全寿命周期管理</tspan>
</text>
<line x1="230" y1="260" x2="800" y2="500" stroke="#6C757D" stroke-width="3" marker-end="url(#arrow-gray)"/>
<rect x="1045" y="185" width="330" height="150" rx="14" fill="#F7E5CC" stroke="#D8892C" stroke-width="3"/>
<text x="1210" y="219" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#D8892C" text-anchor="middle" dominant-baseline="middle" font-weight="700">
