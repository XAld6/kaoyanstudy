<rect x="65" y="575" width="330" height="150" rx="14" fill="#DDECF7" stroke="#2F6FA3" stroke-width="3"/>
<text x="230" y="609" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#2F6FA3" text-anchor="middle" dominant-baseline="middle" font-weight="700">
施工周期短
</text>
<text x="230" y="672" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
<tspan x="230" dy="-13.0">工厂预制与现场并行</tspan>
<tspan x="230" dy="26">缩短占地扰动时间</tspan>
</text>
<line x1="230" y1="650" x2="800" y2="500" stroke="#6C757D" stroke-width="3" marker-end="url(#arrow-gray)"/>
<rect x="1045" y="575" width="330" height="150" rx="14" fill="#E2F1E4" stroke="#4F8F5B" stroke-width="3"/>
<text x="1210" y="609" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#4F8F5B" text-anchor="middle" dominant-baseline="middle" font-weight="700">
质量稳定
</text>
<text x="1210" y="672" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
