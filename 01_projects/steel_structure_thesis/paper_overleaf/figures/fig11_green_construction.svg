<line x1="650" y1="610" x2="650" y2="310" stroke="#1F4E73" stroke-width="6"/>
<line x1="760" y1="610" x2="760" y2="310" stroke="#1F4E73" stroke-width="6"/>
<line x1="870" y1="610" x2="870" y2="310" stroke="#1F4E73" stroke-width="6"/>
<line x1="610" y1="360" x2="990" y2="360" stroke="#1F4E73" stroke-width="5"/>
<line x1="610" y1="460" x2="990" y2="460" stroke="#1F4E73" stroke-width="5"/>
<line x1="610" y1="560" x2="990" y2="560" stroke="#1F4E73" stroke-width="5"/>
<polygon points="800,220 590,310 1010,310" fill="#EEF1F4" stroke="#1F4E73" stroke-width="4"/>
<text x="800" y="660" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" fill="#1F4E73" text-anchor="middle" dominant-baseline="middle" font-weight="700">
装配式钢结构建筑
</text>
<rect x="65" y="185" width="330" height="150" rx="14" fill="#E2F1E4" stroke="#4F8F5B" stroke-width="3"/>
<text x="230" y="219" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#4F8F5B" text-anchor="middle" dominant-baseline="middle" font-weight="700">
材料可回收
</text>
<text x="230" y="282" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222222" text-anchor="middle" dominant-baseline="middle">
